version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: lead_app_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - lead_app_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lead_app_backend
    ports:
      - '5000:5000'
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/leads-dashboard
      - JWT_SECRET=supersecretjwtkey_please_change
      - PORT=5000
    depends_on:
      - mongodb
    networks:
      - lead_app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lead_app_frontend
    ports:
      - '80:80'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - lead_app_network

networks:
  lead_app_network:
    driver: bridge

volumes:
  mongodb_data:
