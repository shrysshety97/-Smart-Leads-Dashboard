services:
  # Backend Service
  - type: web
    name: lead-app-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGODB_URI
        sync: false # You will enter your MongoDB Atlas URI in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true # Render automatically creates a secure secret

  # Frontend Service
  - type: web
    name: lead-app-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # You will set this to: https://your-backend-url.onrender.com/api
